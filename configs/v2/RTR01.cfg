! Buhara Hastanesi - RTR01 (Cisco 2911), ikinci surum
!
! Fabrika ayarlarindaki cihaza, "configure terminal" kipinde yapistirilir.
! DEGISTIR_ ile baslayan parolalar yer tutucudur; yapistirmadan once degistirin.
!
hostname BUHARA-RTR01
!
no ip domain-lookup
ip domain-name buhara.local
service password-encryption
enable secret DEGISTIR_ENABLE_PAROLASI
username yonetici privilege 15 secret DEGISTIR_YONETICI_PAROLASI
banner motd #Yetkisiz erisim yasaktir.#
!
! --- DHCP: yalnizca kullanici aglari. Sunucular ve DMZ sabit adres kullanir.
! --- Her agin ilk 20 adresi (ag gecidi, sabit adresli cihazlar) dagitilmaz.
ip dhcp excluded-address 192.168.10.1 192.168.10.20
ip dhcp excluded-address 192.168.20.1 192.168.20.20
ip dhcp excluded-address 192.168.30.1 192.168.30.20
ip dhcp excluded-address 192.168.40.1 192.168.40.20
!
ip dhcp pool DOKTORLAR
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.50.10
 domain-name buhara.local
ip dhcp pool HEMSIRELER
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.50.10
 domain-name buhara.local
ip dhcp pool YONETIM
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 192.168.50.10
 domain-name buhara.local
ip dhcp pool BILGIISLEM
 network 192.168.40.0 255.255.255.0
 default-router 192.168.40.1
 dns-server 192.168.50.10
 domain-name buhara.local
!
! --- Erisim kurallari. Her liste, ilgili agdan yonlendiriciye GIREN trafige uygulanir.
! --- Sunucular: 192.168.50.10 DC01 (DNS, oturum acma), 192.168.50.2 SRV01, 192.168.60.10 WEB-DMZ
!
ip access-list extended DOKTORLAR-GIRIS
 remark DHCP istekleri
 permit udp any eq 68 any eq 67
 remark Ag gecidine ping
 permit icmp 192.168.10.0 0.0.0.255 host 192.168.10.1
 remark DC01: DNS ve oturum acma
 permit ip 192.168.10.0 0.0.0.255 host 192.168.50.10
 remark SRV01: klinik sunucu
 permit ip 192.168.10.0 0.0.0.255 host 192.168.50.2
 remark DMZ web sunucusu: web ve ping
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.60.10 eq 80
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.60.10 eq 443
 permit icmp 192.168.10.0 0.0.0.255 host 192.168.60.10 echo
 remark Bilgi Islem'in baslattigi baglantilara yanit
 permit tcp 192.168.10.0 0.0.0.255 192.168.40.0 0.0.0.255 established
 permit icmp 192.168.10.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 remark Diger aglara erisim yok
 deny ip any any
!
ip access-list extended HEMSIRELER-GIRIS
 remark DHCP istekleri
 permit udp any eq 68 any eq 67
 remark Ag gecidine ping
 permit icmp 192.168.20.0 0.0.0.255 host 192.168.20.1
 remark DC01: DNS ve oturum acma
 permit ip 192.168.20.0 0.0.0.255 host 192.168.50.10
 remark SRV01 izni yok: hemsireler klinik sunucuya erisemez
 remark DMZ web sunucusu: web ve ping
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.60.10 eq 80
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.60.10 eq 443
 permit icmp 192.168.20.0 0.0.0.255 host 192.168.60.10 echo
 remark Bilgi Islem'in baslattigi baglantilara yanit
 permit tcp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 established
 permit icmp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 remark Diger aglara erisim yok
 deny ip any any
!
ip access-list extended YONETIM-GIRIS
 remark DHCP istekleri
 permit udp any eq 68 any eq 67
 remark Ag gecidine ping
 permit icmp 192.168.30.0 0.0.0.255 host 192.168.30.1
 remark DC01: DNS ve oturum acma
 permit ip 192.168.30.0 0.0.0.255 host 192.168.50.10
 remark SRV01: klinik sunucu
 permit ip 192.168.30.0 0.0.0.255 host 192.168.50.2
 remark DMZ web sunucusu: web ve ping
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.60.10 eq 80
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.60.10 eq 443
 permit icmp 192.168.30.0 0.0.0.255 host 192.168.60.10 echo
 remark Bilgi Islem'in baslattigi baglantilara yanit
 permit tcp 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255 established
 permit icmp 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 remark Diger aglara erisim yok
 deny ip any any
!
ip access-list extended DMZ-GIRIS
 remark Ag gecidine ping
 permit icmp 192.168.60.0 0.0.0.255 host 192.168.60.1
 remark Ic aglardan baslatilan baglantilara yanit
 permit tcp 192.168.60.0 0.0.0.255 192.168.0.0 0.0.255.255 established
 permit icmp 192.168.60.0 0.0.0.255 192.168.0.0 0.0.255.255 echo-reply
 remark DMZ ic aglara baglanti baslatamaz
 deny ip any any
!
! --- Cihaza SSH ile yalnizca Bilgi Islem agindan baglanilir.
access-list 10 remark Cihaz yonetimi: Bilgi Islem agi
access-list 10 permit 192.168.40.0 0.0.0.255
!
! --- Arayuzler (router-on-a-stick)
interface GigabitEthernet0/0
 description SW01 Fa0/1 (trunk)
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description VLAN 10 - Doktorlar
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip access-group DOKTORLAR-GIRIS in
!
interface GigabitEthernet0/0.20
 description VLAN 20 - Hemsireler
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip access-group HEMSIRELER-GIRIS in
!
interface GigabitEthernet0/0.30
 description VLAN 30 - Yonetim
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip access-group YONETIM-GIRIS in
!
interface GigabitEthernet0/0.40
 description VLAN 40 - Bilgi Islem
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
!
interface GigabitEthernet0/0.50
 description VLAN 50 - Sunucular
 encapsulation dot1Q 50
 ip address 192.168.50.1 255.255.255.0
!
interface GigabitEthernet0/0.60
 description VLAN 60 - DMZ
 encapsulation dot1Q 60
 ip address 192.168.60.1 255.255.255.0
 ip access-group DMZ-GIRIS in
!
interface GigabitEthernet0/0.999
 description Native VLAN (trafik tasimaz)
 encapsulation dot1Q 999 native
!
interface GigabitEthernet0/1
 description Kullanilmiyor
 no ip address
 shutdown
!
interface GigabitEthernet0/2
 description Kullanilmiyor
 no ip address
 shutdown
!
! --- Uzaktan yonetim: yalnizca SSH, yerel kullanici ile
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
!
line con 0
 login local
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
 access-class 10 in
 exec-timeout 5 0
!
end
