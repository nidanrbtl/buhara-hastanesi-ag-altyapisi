! Buhara Hastanesi - SW01 (Cisco 2960-24TT), ikinci surum
!
! Fabrika ayarlarindaki cihaza, "configure terminal" kipinde yapistirilir.
! DEGISTIR_ ile baslayan parolalar yer tutucudur; yapistirmadan once degistirin.
!
hostname BUHARA-SW01
!
no ip domain-lookup
ip domain-name buhara.local
service password-encryption
enable secret DEGISTIR_ENABLE_PAROLASI
username yonetici privilege 15 secret DEGISTIR_YONETICI_PAROLASI
banner motd #Yetkisiz erisim yasaktir.#
!
vlan 10
 name DOKTORLAR
vlan 20
 name HEMSIRELER
vlan 30
 name YONETIM
vlan 40
 name BILGIISLEM
vlan 50
 name SUNUCULAR
vlan 60
 name DMZ
vlan 998
 name KULLANILMAYAN
vlan 999
 name NATIVE
!
! --- Yonlendiriciye giden trunk: yalnizca kullanilan VLAN'lar, native VLAN bos bir VLAN
interface FastEthernet0/1
 description RTR01 G0/0 (trunk)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60
 switchport nonegotiate
!
! --- Uc portlar: tek VLAN, tek MAC adresi, BPDU gelirse port kapanir
interface FastEthernet0/2
 description DOKTOR-PC
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/3
 description HEMSIRE-PC
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/4
 description YONETIM-PC
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/5
 description BILGIISLEM-PC
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/6
 description SRV01
 switchport mode access
 switchport access vlan 50
 switchport port-security
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/7
 description WEB-DMZ
 switchport mode access
 switchport access vlan 60
 switchport port-security
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! --- Kullanilmayan portlar: bos bir VLAN'da ve kapali
interface range FastEthernet0/8 - 24
 description Kullanilmiyor
 switchport mode access
 switchport access vlan 998
 shutdown
!
interface range GigabitEthernet0/1 - 2
 description Kullanilmiyor
 switchport mode access
 switchport access vlan 998
 shutdown
!
! --- Cihaz yonetimi: Bilgi Islem agindan, yalnizca SSH
interface Vlan1
 no ip address
 shutdown
!
interface Vlan40
 description Cihaz yonetimi
 ip address 192.168.40.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.40.1
!
access-list 10 remark Cihaz yonetimi: Bilgi Islem agi
access-list 10 permit 192.168.40.0 0.0.0.255
!
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
!
line con 0
 login local
 exec-timeout 5 0
 logging synchronous
line vty 0 15
 login local
 transport input ssh
 access-class 10 in
 exec-timeout 5 0
!
end
