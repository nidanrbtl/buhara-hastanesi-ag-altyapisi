!
version 12.2(37)SE1
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
!
hostname CORE1
!
!
no profinet
enable secret DEGISTIR_ENABLE_PAROLASI
!
!
ip dhcp excluded-address 192.168.10.1 192.168.10.99
ip dhcp excluded-address 192.168.10.150 192.168.10.254
ip dhcp excluded-address 192.168.20.1 192.168.20.99
ip dhcp excluded-address 192.168.20.150 192.168.20.254
ip dhcp excluded-address 192.168.30.1 192.168.30.99
ip dhcp excluded-address 192.168.30.150 192.168.30.254
ip dhcp excluded-address 192.168.40.1 192.168.40.99
ip dhcp excluded-address 192.168.40.150 192.168.40.254
ip dhcp excluded-address 192.168.90.1 192.168.90.99
ip dhcp excluded-address 192.168.90.150 192.168.90.254
!
ip dhcp pool DOKTORLAR
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.50.10
ip dhcp pool HEMSIRELER
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.50.10
ip dhcp pool IDARI
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 192.168.50.10
ip dhcp pool BILGI-ISLEM
 network 192.168.40.0 255.255.255.0
 default-router 192.168.40.1
 dns-server 192.168.50.10
ip dhcp pool MISAFIR
 network 192.168.90.0 255.255.255.0
 default-router 192.168.90.1
 dns-server 198.51.100.10
!
!
ip routing
!
!
!
!
username btadmin secret DEGISTIR_SSH_PAROLASI
!
!
!
!
!
!
!
!
!
!
ip ssh version 2
no ip domain-lookup
ip domain-name buhara.local
!
!
vtp mode transparent
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,70,80,90,99-100 priority 4096
!
!
!
!
!
!
vlan 10
 name DOKTORLAR
!
vlan 20
 name HEMSIRELER
!
vlan 30
 name IDARI
!
vlan 40
 name BILGI-ISLEM
!
vlan 50
 name SUNUCULAR
!
vlan 70
 name TIBBI-CIHAZLAR
!
vlan 80
 name KAMERALAR
!
vlan 90
 name MISAFIR
!
vlan 99
 name CIHAZ-YONETIM
!
vlan 100
 name CEKIRDEK-GECIS
!
vlan 999
 name KULLANILMAYAN
!
interface Port-channel1
 description CORE2 EtherChannel
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,70,80,90,99-100
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet0/1
 description ACC-KAT1 Gi0/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,70,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
interface FastEthernet0/2
 description ACC-KAT2 Gi0/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 30,40,80,90,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
interface FastEthernet0/3
 description ACC-SRV Gi0/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 50,99
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
interface FastEthernet0/4
 description KULLANILMIYOR
