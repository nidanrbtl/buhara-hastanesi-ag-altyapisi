!
interface FastEthernet0/24
 description EDGE Gi0/0
 no switchport
 ip address 10.0.0.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf priority 1
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description CORE2 EtherChannel
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,70,80,90,99-100
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
!
interface GigabitEthernet0/2
 description CORE2 EtherChannel
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,70,80,90,99-100
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan10
 description DOKTORLAR
 mac-address 0060.3e5e.1201
 ip address 192.168.10.2 255.255.255.0
 ip access-group ACL-DOKTOR in
 standby 10 ip 192.168.10.1
 standby 10 priority 110
 standby 10 preempt
!
interface Vlan20
 description HEMSIRELER
 mac-address 0060.3e5e.1202
 ip address 192.168.20.2 255.255.255.0
 ip access-group ACL-HEMSIRE in
 standby 20 ip 192.168.20.1
 standby 20 priority 110
 standby 20 preempt
!
interface Vlan30
 description IDARI
 mac-address 0060.3e5e.1203
 ip address 192.168.30.2 255.255.255.0
 ip access-group ACL-IDARI in
 standby 30 ip 192.168.30.1
 standby 30 priority 110
 standby 30 preempt
!
interface Vlan40
 description BILGI-ISLEM
 mac-address 0060.3e5e.1204
 ip address 192.168.40.2 255.255.255.0
 ip access-group ACL-BT in
 standby 40 ip 192.168.40.1
 standby 40 priority 110
 standby 40 preempt
!
interface Vlan50
 description SUNUCULAR
 mac-address 0060.3e5e.1205
 ip address 192.168.50.2 255.255.255.0
 ip access-group ACL-SUNUCU in
 standby 50 ip 192.168.50.1
 standby 50 priority 110
 standby 50 preempt
!
interface Vlan70
 description TIBBI-CIHAZLAR
 mac-address 0060.3e5e.1206
 ip address 192.168.70.2 255.255.255.0
 ip access-group ACL-TIBBI in
 standby 70 ip 192.168.70.1
 standby 70 priority 110
 standby 70 preempt
!
interface Vlan80
 description KAMERALAR
 mac-address 0060.3e5e.1207
 ip address 192.168.80.2 255.255.255.0
 ip access-group ACL-KAMERA in
 standby 80 ip 192.168.80.1
 standby 80 priority 110
 standby 80 preempt
!
interface Vlan90
 description MISAFIR
 mac-address 0060.3e5e.1208
 ip address 192.168.90.2 255.255.255.0
 ip access-group ACL-MISAFIR in
 standby 90 ip 192.168.90.1
 standby 90 priority 110
 standby 90 preempt
!
interface Vlan99
 description CIHAZ-YONETIM
 mac-address 0060.3e5e.1209
 ip address 192.168.99.2 255.255.255.0
 ip access-group ACL-YONETIM in
 standby 99 ip 192.168.99.1
 standby 99 priority 110
 standby 99 preempt
!
interface Vlan100
 description CEKIRDEK-GECIS
 mac-address 0060.3e5e.120a
 ip address 10.0.0.9 255.255.255.252
!
router ospf 1
 router-id 10.255.0.1
 log-adjacency-changes
 passive-interface default
 no passive-interface FastEthernet0/24
 no passive-interface Vlan100
 network 192.168.0.0 0.0.255.255 area 0
 network 10.0.0.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
ip access-list extended ACL-DOKTOR
 remark DHCP istegi ve HSRP
 permit udp any eq bootpc any eq bootps
 permit udp 192.168.10.0 0.0.0.3 host 224.0.0.2 eq 1985
 remark Ag gecidine ping
 permit icmp 192.168.10.0 0.0.0.255 192.168.10.0 0.0.0.3
 remark DNS
 permit udp 192.168.10.0 0.0.0.255 host 192.168.50.10 eq domain
 remark SRV01 uygulamasi
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.50.20 eq www
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.50.20 eq 443
 remark DMZ web
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.60.10 eq www
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.60.10 eq 443
 remark Bilgi Islem baglantilarinin yanitlari
 permit tcp 192.168.10.0 0.0.0.255 192.168.40.0 0.0.0.255 established
 permit icmp 192.168.10.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 remark Diger ic aglar yasak, kalan internet
 deny ip any 192.168.0.0 0.0.255.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 permit ip 192.168.10.0 0.0.0.255 any
ip access-list extended ACL-HEMSIRE
 remark DHCP istegi ve HSRP
 permit udp any eq bootpc any eq bootps
 permit udp 192.168.20.0 0.0.0.3 host 224.0.0.2 eq 1985
 remark Ag gecidine ping
 permit icmp 192.168.20.0 0.0.0.255 192.168.20.0 0.0.0.3
 remark DNS
 permit udp 192.168.20.0 0.0.0.255 host 192.168.50.10 eq domain
 remark SRV01 yasak (hasta verisi)
 deny ip 192.168.20.0 0.0.0.255 host 192.168.50.20
 remark DMZ web
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.60.10 eq www
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.60.10 eq 443
 remark Bilgi Islem baglantilarinin yanitlari
 permit tcp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 established
 permit icmp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 remark Diger ic aglar yasak, kalan internet
 deny ip any 192.168.0.0 0.0.255.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 permit ip 192.168.20.0 0.0.0.255 any
ip access-list extended ACL-IDARI
 remark DHCP istegi ve HSRP
 permit udp any eq bootpc any eq bootps
 permit udp 192.168.30.0 0.0.0.3 host 224.0.0.2 eq 1985
 remark Ag gecidine ping
 permit icmp 192.168.30.0 0.0.0.255 192.168.30.0 0.0.0.3
 remark DNS
 permit udp 192.168.30.0 0.0.0.255 host 192.168.50.10 eq domain
 remark SRV01 yasak (hasta verisi)
 deny ip 192.168.30.0 0.0.0.255 host 192.168.50.20
 remark DMZ web
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.60.10 eq www
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.60.10 eq 443
 remark Bilgi Islem baglantilarinin yanitlari
 permit tcp 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255 established
 permit icmp 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 remark Diger ic aglar yasak, kalan internet
 deny ip any 192.168.0.0 0.0.255.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 permit ip 192.168.30.0 0.0.0.255 any
ip access-list extended ACL-BT
 remark DHCP istegi ve HSRP
 permit udp any eq bootpc any eq bootps
 permit udp 192.168.40.0 0.0.0.3 host 224.0.0.2 eq 1985
 remark Bilgi Islem her yere erisir
 permit ip 192.168.40.0 0.0.0.255 any
ip access-list extended ACL-TIBBI
 remark HSRP ve ag gecidine ping
 permit udp 192.168.70.0 0.0.0.3 host 224.0.0.2 eq 1985
 permit icmp 192.168.70.0 0.0.0.255 192.168.70.0 0.0.0.3
 remark Yalnizca kendi sunucusu
 permit tcp 192.168.70.0 0.0.0.255 host 192.168.50.20 eq www
 permit tcp 192.168.70.0 0.0.0.255 host 192.168.50.20 eq 443
 remark Bilgi Islem baglantilarinin yanitlari
 permit tcp 192.168.70.0 0.0.0.255 192.168.40.0 0.0.0.255 established
 permit icmp 192.168.70.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 deny ip any any
ip access-list extended ACL-KAMERA
 remark HSRP ve ag gecidine ping
 permit udp 192.168.80.0 0.0.0.3 host 224.0.0.2 eq 1985
 permit icmp 192.168.80.0 0.0.0.255 192.168.80.0 0.0.0.3
 remark Yalnizca kendi sunucusu
 permit tcp 192.168.80.0 0.0.0.255 host 192.168.50.40 eq www
 permit tcp 192.168.80.0 0.0.0.255 host 192.168.50.40 eq 443
 remark Bilgi Islem baglantilarinin yanitlari
 permit tcp 192.168.80.0 0.0.0.255 192.168.40.0 0.0.0.255 established
 permit icmp 192.168.80.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 deny ip any any
ip access-list extended ACL-MISAFIR
 remark DHCP istegi ve HSRP
 permit udp any eq bootpc any eq bootps
 permit udp 192.168.90.0 0.0.0.3 host 224.0.0.2 eq 1985
 remark Ag gecidine ping
 permit icmp 192.168.90.0 0.0.0.255 192.168.90.0 0.0.0.3
 remark Ic aglarin hicbiri, yalnizca internet
 deny ip any 192.168.0.0 0.0.255.255
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 172.16.0.0 0.15.255.255
 permit ip 192.168.90.0 0.0.0.255 any
ip access-list standard ACL-SSH-YONETIM
 remark Cihaz yonetimi yalnizca Bilgi Islem agindan
 permit 192.168.40.0 0.0.0.255
ip access-list extended ACL-SUNUCU
 remark HSRP ve ag gecidine ping
 permit udp 192.168.50.0 0.0.0.3 host 224.0.0.2 eq 1985
 permit icmp 192.168.50.0 0.0.0.255 192.168.50.0 0.0.0.3
 remark DNS yanitlari yalnizca ic aglara
 permit udp host 192.168.50.10 eq domain 192.168.0.0 0.0.255.255
 remark NTP yanitlari ag cihazlarina
 permit udp host 192.168.50.30 eq 123 192.168.50.0 0.0.0.3
 permit udp host 192.168.50.30 eq 123 192.168.99.0 0.0.0.255
 permit udp host 192.168.50.30 eq 123 10.0.0.0 0.0.0.255
 remark Istemcilerin baslattigi TCP baglantilarinin yanitlari
 permit tcp 192.168.50.0 0.0.0.255 192.168.0.0 0.0.255.255 established
 remark Bilgi Islem ping yanitlari
 permit icmp 192.168.50.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 deny ip any any
ip access-list extended ACL-YONETIM
 remark HSRP ve ag gecidine ping
 permit udp 192.168.99.0 0.0.0.3 host 224.0.0.2 eq 1985
 permit icmp 192.168.99.0 0.0.0.255 192.168.99.0 0.0.0.3
 remark Bilgi Islemden diger cekirdegin yonetim adresine
 permit tcp 192.168.40.0 0.0.0.255 192.168.99.0 0.0.0.3 eq 22
 permit icmp 192.168.40.0 0.0.0.255 192.168.99.0 0.0.0.3 echo
 remark Syslog ve NTP
 permit udp 192.168.99.0 0.0.0.255 host 192.168.50.30 eq 514
 permit udp 192.168.99.0 0.0.0.255 host 192.168.50.30 eq 123
 remark Bilgi Islemin SSH ve ping yanitlari
 permit tcp 192.168.99.0 0.0.0.255 eq 22 192.168.40.0 0.0.0.255 established
 permit icmp 192.168.99.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 deny ip any any
!
banner motd #Yetkisiz erisim yasaktir. Tum oturumlar kaydedilir.#
!
!
!
!
!
logging 192.168.50.30
line con 0
!
line aux 0
!
line vty 0 4
 access-class ACL-SSH-YONETIM in
 login local
 transport input ssh
line vty 5 15
 access-class ACL-SSH-YONETIM in
 login local
 transport input ssh
!
!
!
ntp server 192.168.50.30
!
end
