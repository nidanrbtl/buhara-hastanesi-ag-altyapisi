!
version 15.0
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
!
hostname ACC-KAT1
!
enable secret DEGISTIR_ENABLE_PAROLASI
!
!
!
ip ssh version 2
no ip domain-lookup
ip domain-name buhara.local
!
username btadmin secret DEGISTIR_SSH_PAROLASI
!
vtp mode transparent
!
!
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 10
 name DOKTORLAR
!
vlan 20
 name HEMSIRELER
!
vlan 70
 name TIBBI-CIHAZLAR
!
vlan 99
 name CIHAZ-YONETIM
!
vlan 999
 name KULLANILMAYAN
!
interface FastEthernet0/1
 description PC-DOKTOR
 switchport access vlan 10
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 switchport port-security mac-address sticky 0090.2170.CD79
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/2
 description PC-HEMSIRE
 switchport access vlan 20
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 switchport port-security mac-address sticky 0002.4A27.C2E2
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/3
 description TIBBI-CIHAZ
 switchport access vlan 70
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 switchport port-security mac-address sticky 0001.43CB.6CB4
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface FastEthernet0/4
 description KULLANILMIYOR
 switchport access vlan 999
 switchport mode access
 shutdown
!
