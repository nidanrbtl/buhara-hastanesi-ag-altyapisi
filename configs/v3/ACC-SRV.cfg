!
interface Vlan99
 description CIHAZ-YONETIM
 ip address 192.168.99.13 255.255.255.0
!
ip default-gateway 192.168.99.1
!
banner motd #Yetkisiz erisim yasaktir. Tum oturumlar kaydedilir.#
logging 192.168.50.30
!
!
!
ip access-list standard ACL-SSH-YONETIM
 remark Cihaz yonetimi yalnizca Bilgi Islem agindan
 permit 192.168.40.0 0.0.0.255
line con 0
!
line vty 0 4
 access-class ACL-SSH-YONETIM in
 login local
 transport input ssh
line vty 5 15
 access-class ACL-SSH-YONETIM in
 login local
 transport input ssh
!
!
!
ntp server 192.168.50.30
!
