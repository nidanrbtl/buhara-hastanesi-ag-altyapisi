!
version 15.1
service timestamps log datetime msec
service timestamps debug datetime msec
service password-encryption
!
hostname EDGE
!
!
!
enable secret DEGISTIR_ENABLE_PAROLASI
!
!
!
!
!
!
no ip cef
no ipv6 cef
!
!
!
username btadmin secret DEGISTIR_SSH_PAROLASI
!
!
license udi pid CISCO2911/K9 sn FTX15247YSG-
!
!
!
!
!
!
!
!
!
!
!
ip ssh version 2
no ip domain-lookup
ip domain-name buhara.local
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 description CORE1 Fa0/24
 ip address 10.0.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf priority 1
 ip nat inside
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description CORE2 Fa0/24
 ip address 10.0.0.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf priority 1
 ip nat inside
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description DMZ
 ip address 192.168.60.1 255.255.255.0
 ip nat inside
 ip access-group ACL-DMZ-GIRIS in
 duplex auto
 speed auto
!
interface Serial0/0/0
 description ISS
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 ip access-group ACL-INTERNET-GIRIS in
 clock rate 2000000
!
interface Serial0/0/1
 no ip address
 clock rate 2000000
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.0.3
 log-adjacency-changes
 passive-interface GigabitEthernet0/2
 network 10.0.0.0 0.0.0.7 area 0
 network 192.168.60.0 0.0.0.255 area 0
 default-information originate
!
ip nat inside source list NAT-IZINLI interface Serial0/0/0 overload
ip nat inside source static tcp 192.168.60.10 80 203.0.113.2 80
ip nat inside source static tcp 192.168.60.10 443 203.0.113.2 443
ip classless
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
ip flow-export version 9
!
!
ip access-list standard NAT-IZINLI
 remark Internete cikabilen aglar
 permit 192.168.10.0 0.0.0.255
 permit 192.168.20.0 0.0.0.255
 permit 192.168.30.0 0.0.0.255
 permit 192.168.40.0 0.0.0.255
 permit 192.168.90.0 0.0.0.255
ip access-list extended ACL-DMZ-GIRIS
 remark Ag gecidine ping
 permit icmp 192.168.60.0 0.0.0.255 host 192.168.60.1
 remark Web sunucusunun yanitlari (iceriye ve internete)
 permit tcp host 192.168.60.10 eq www any established
 permit tcp host 192.168.60.10 eq 443 any established
 remark Bilgi Islem baglantilarinin yanitlari
 permit tcp 192.168.60.0 0.0.0.255 192.168.40.0 0.0.0.255 established
 permit icmp 192.168.60.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
 remark DMZ hicbir yere baglanti baslatamaz
 deny ip any any
ip access-list extended ACL-INTERNET-GIRIS
 remark Disaridan yalnizca DMZ web (sabit NAT)
 permit tcp any host 203.0.113.2 eq www
 permit tcp any host 203.0.113.2 eq 443
 remark Iceriden baslatilan baglantilarin yanitlari
 permit tcp any host 203.0.113.2 established
 permit udp any eq domain host 203.0.113.2
 permit icmp any host 203.0.113.2 echo-reply
 deny ip any any
ip access-list standard ACL-SSH-YONETIM
 remark Cihaz yonetimi yalnizca Bilgi Islem agindan
 permit 192.168.40.0 0.0.0.255
!
banner motd #Yetkisiz erisim yasaktir. Tum oturumlar kaydedilir.#
!
!
!
!
logging 192.168.50.30
line con 0
!
line aux 0
!
line vty 0 4
 access-class ACL-SSH-YONETIM in
 login local
 transport input ssh
line vty 5 15
 access-class ACL-SSH-YONETIM in
 login local
 transport input ssh
!
!
ntp server 192.168.50.30
!
end
